<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UROP · Multi-agent content lab</title>
    <!-- A printer's registration mark, out of register. favicon.svg keeps its
         prefers-color-scheme rule, because the browser tab strip genuinely
         does follow the OS. The in-page twin is no longer this file: an SVG
         loaded through <img> is a separate document and cannot see the app's
         custom properties, so the mark is now an inline React component in
         components/Mark.tsx that inherits currentColor. mark.svg survives
         only as the touch icon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/mark.svg" />
    <meta name="theme-color" content="#0e0d0d" />
    <meta
      name="description"
      content="One topic in, a full study set out: notes, flashcards, a narrated video and PDFs, generated by four agents running in parallel. SUTD undergraduate research."
    />

    <!-- The card people see when this link is pasted into WhatsApp, LinkedIn,
         Slack or Discord. Without these the link renders as bare text, which
         for a link whose job is to be sent to a supervisor and sit on a CV is
         the whole first impression.

         og:image must be ABSOLUTE. Crawlers do not resolve relative paths, and
         a relative one fails silently — the card renders with no image rather
         than with an error. The source for og.png is web/og/card.html, which
         carries the command to regenerate it.

         No og:url either: a hardcoded canonical URL would be wrong on every
         Vercel preview deployment, and crawlers fall back to the requested URL
         when it is absent, which is the behaviour we want. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UROP · Multi-agent content lab" />
    <meta property="og:title" content="One topic in. A full study set out." />
    <meta
      property="og:description"
      content="Four agents build notes, flashcards, a narrated video and printable PDFs from a single topic. SUTD undergraduate research into whether parallelising the pipeline actually pays."
    />
    <meta property="og:image" content="https://parallel-ai-agents.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="UROP: one topic in, a full study set out. The figures 17.4x faster video assembly and 98% of it before any parallelism, set as misregistered process plates."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="One topic in. A full study set out." />
    <meta
      name="twitter:description"
      content="Four agents build notes, flashcards, a narrated video and printable PDFs from a single topic. SUTD undergraduate research."
    />
    <meta name="twitter:image" content="https://parallel-ai-agents.vercel.app/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Three roles: the serif for headlines and long-form reading, Inter for
         the dense chrome, Space Mono for technical metadata.

         Italic 400 on the serif is not optional: the design uses italic for
         every muted caption, and without it the browser synthesises a slanted
         roman, which reads as a rendering fault in a serif.

         Inter is requested as a VARIABLE axis (wght@400..600). The UI weights
         are 510 and 590, which a static request would silently round to 500
         and 600. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400..600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
