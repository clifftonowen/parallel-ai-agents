<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UROP · Multi-agent content lab</title>
    <!-- A printer's registration mark, out of register. It flips to paper
         colour in dark mode, because the tab strip follows the OS theme and a
         black mark disappears on a dark one. mark.svg is the in-page twin,
         which does not flip: this app's own ground is always paper. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/mark.svg" />
    <meta name="theme-color" content="#f3f2f2" />
    <meta
      name="description"
      content="One topic in, a full study set out: notes, flashcards, a narrated video and PDFs, generated by four agents running in parallel. SUTD undergraduate research."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- One family in every role. Italic 400 is not optional: the design uses
         italic for every muted caption, and without it the browser synthesises
         a slanted roman, which reads as a rendering fault in a serif. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
