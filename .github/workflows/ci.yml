name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same ref cancels the previous run — these builds are cheap
# but the docker job added later is not.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # "build" is `tsc -b && vite build`, so this is a real typecheck, not just
      # a bundle. It is the only type gate the frontends have.
      - name: build (typecheck + bundle)
        run: npm run build

      - name: lint
        run: npm run lint
