name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same ref cancels the previous run — these builds are cheap
# but the docker job added later is not.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 22, not 20. jsdom 30 reaches for webidl.util.markAsUncloneable,
          # which Node only gained in 22 — on 20 every vitest run dies with
          # "markAsUncloneable is not a function". Actions also deprecated
          # Node 20 runners.
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # "build" is `tsc -b && vite build`, so this is a real typecheck, not just
      # a bundle. It also typechecks vite.config.ts, which the dev server does
      # not — that is how a missing @types/node got caught rather than shipped.
      - name: build (typecheck + bundle)
        run: npm run build

      - name: lint
        run: npm run lint

      # jsdom-backed. The markdown suite is a security control, not a
      # formatting check: it asserts that script tags, event handlers and
      # javascript: hrefs do not survive sanitising.
      - name: test
        run: npm test

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # requirements-dev.txt, not requirements.txt: the full runtime pulls
      # moviepy, playwright + Chromium and google-adk, none of which any of
      # these tests touch. See the note at the top of that file.
      - name: install
        run: pip install -r requirements-dev.txt

      # Narrow on purpose: F (pyflakes) is high-signal and passes clean today.
      # Widening the rule set is a separate, deliberate change.
      - name: lint
        run: ruff check .

      # This is the first environment other than Windows this code has run in,
      # so path and encoding assumptions surface here first.
      - name: test
        run: pytest -q

  # ── deploy ─────────────────────────────────────────────────────────────────
  # Only from main, only on a push, and only behind both test jobs. The
  # front-end deploys itself: Vercel builds on every push to main, so this is
  # the backend half.
  deploy:
    name: deploy api
    needs: [web, python]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    # Its own group, deliberately not the workflow's. The concurrency block at
    # the top of this file sets cancel-in-progress, which is right for tests
    # and wrong for a deploy: a second push would cancel a half-finished one
    # and leave the machine in whatever state it had reached.
    concurrency:
      group: deploy-api
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      # Pinned to a commit, not @master. This step is the one place in the
      # repository where FLY_API_TOKEN exists, so a mutable ref means whoever
      # controls that action can take the deploy token by pushing to their own
      # default branch. The first-party actions above are pinned to major tags,
      # which is GitHub's own recommendation and a smaller blast radius; this
      # one gets a SHA because of what it can reach.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.5

      # --remote-only builds on Fly's builders. The image carries ffmpeg,
      # pandoc, tectonic and Chromium, so building it here and pushing it would
      # mean moving a couple of gigabytes out of the runner for no reason.
      - name: deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # A deploy replaces the machine, so anything mid-run dies. The server
      # marks those rows failed at boot rather than leaving them "running"
      # forever, and this is where you would see that it did.
      - name: show boot log
        run: flyctl logs --no-tail | tail -40
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
